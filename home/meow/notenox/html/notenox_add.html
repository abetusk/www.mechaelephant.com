<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A layout example with a side menu that hides on mobile, just like the Pure website.">
    <title>notenox</title>
    <link rel="stylesheet" href="css/pure-min.css">
    <link rel="stylesheet" href="css/pure-styles.css">
    <link rel="stylesheet" href="css/notenox-styles.css">
</head>
<body>

<div id="layout">

  <div id="main">

    <div class='pure-g'>
      <div class='pure-u-1-2'>
        <h3> notenox add </h3>
      </div>
      <div class='pure-u-1-2'>
        <button class='pure-button' onclick='notenox_add_button("cancel");'>cancel</button>

      </div>
    </div>


    <div class='pure-g'>
      <div class='pure-u-1-8'>title:</div>
      <div class='pure-u-3-4'>
        <textarea id='ui_title' rows='1' cols='40'></textarea>
      </div>
      <div class='pure-u-1-8'>&nbsp;</div>
    </div>

    <br>

    <div class='pure-g'>
      <div class='pure-u-1-8'>tags:</div>
      <div class='pure-u-3-4'>
        <textarea id='ui_tags' rows='1' cols='40'></textarea>
      </div>
      <div class='pure-u-1-8'>(";" sep.)</div>

    </div>

    <br>

    <div class='pure-g'>
      <div class='pure-u-1-8'>text:</div>
      <div class='pure-u-3-4'>
        <textarea id='ui_text' rows='20' cols='40'></textarea>
      </div>
      <div class='pure-u-1-8'>&nbsp;</div>
    </div>

    <br>

    <div class='pure-g'>
      <div class='pure-u-1-8'>links:</div>
      <div class='pure-u-3-4'>
        <textarea id='ui_links' rows='4' cols='40'></textarea>
      </div>
      <div class='pure-u-1-8'>("\n" separated)</div>
    </div>

    <br>

    <div class='pure-g'>
      <div class='pure-u-1-3'>
        <button class='pure-button' style='color:white; background: rgb(223,117,20);' onclick='notenox_add_button("preview");'>preview</button>
      </div>
      <div class='pure-u-1-3'>
        &nbsp;
      </div>
      <div class='pure-u-1-3'>
        <button class='pure-button' style='color:white; background: rgb(66,184,221);' onclick='notenox_add_button("submit");'>submit</button>
      </div>
    </div>

  </div>

    <br>
  <hr>
    <br>

  <div class='pure-g'>
    <textarea id='ui_preview' style='field-sizing: content; border: none; outline: none; resize:none; width:100%;' readonly></textarea>
  </div>

</div>

<script src='js/notenox-add.js'></script>

</body>
</html>
